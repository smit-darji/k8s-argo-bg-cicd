<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K8s Green Deployment</title>
  <style>
    body {
      background-color: #2842b6;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { font-size: 3em; margin-bottom: 10px; }
    p { font-size: 1.2em; opacity: 0.9; }
    .tag {
      background: white;
      color: #0eacb8;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
    }
    button {
      background: white;
      color: #0ba531;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
    }
    button:hover { background:  #85eea8; color: white; }
  </style>
</head>
<body>
  <h1>🌿 Green Deployment Active!</h1>
  <p>This is the <strong>Green Version (4th Nov 02:45)</strong> of your K8s App.</p>
  <div class="tag">Environment: Green</div>

  <div style="margin-top:30px;">
    <button onclick="sendLog('INFO')">Add Success Log</button>
    <button onclick="sendLog('ERROR')">Add Error Log</button>
  </div>

  <script>
    async function sendLog(level) {
      const res = await fetch("/push_log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ level })
      });
      const text = await res.text();
      alert(text);
    }
  </script>
</body>
</html>
