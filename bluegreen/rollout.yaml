apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webapp-bg
  namespace: webapp-bg
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    blueGreen:
      activeService: webapp-bg-stable
      previewService: webapp-bg-preview
      autoPromotionEnabled: true
      autoPromotionSeconds: 180   # promote after 3 minutes if healthy
  template:
    metadata:
      labels:
        app: webapp
        version: PLACEHOLDER_COLOR   # 👈 GitHub Action will replace this
    spec:
      containers:
        - name: webapp
          image: smitdarji/k8s:PLACEHOLDER_TAG  # 👈 GitHub Action will replace this
          ports:
            - containerPort: 80
