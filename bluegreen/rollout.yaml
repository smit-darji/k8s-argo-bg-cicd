apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webapp-bg
  namespace: webapp-bg
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    blueGreen:
      activeService: webapp-bg-stable
      previewService: webapp-bg-preview
      autoPromotionEnabled: true
  template:
    metadata:
      labels:
        app: webapp
        version: blue   # 👈 auto-updated by GitHub Action
    spec:
      containers:
        - name: webapp
          image: smitdarji/k8s:v.b.1.5
          ports:
            - containerPort: 80
