apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webapp-bg
  namespace: webapp-bg
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webapp-bg
  template:
    metadata:
      labels:
        app: webapp-bg
    spec:
      containers:
      - name: webapp-bg
        image: smitdarji/k8s:v1.0.0   # ✅ update tag when releasing new version
        ports:
        - containerPort: 80

  strategy:
    blueGreen:
      activeService: webapp-bg-stable
      previewService: webapp-bg-canary
      autoPromotionEnabled: false         # 🚫 don't switch immediately
      autoPromotionSeconds: 900           # ⏳ wait 15 minutes before auto-promote
      scaleDownDelaySeconds: 30           # optional cleanup delay for old pods
