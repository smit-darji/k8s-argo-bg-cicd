apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webapp-bg
  namespace: webapp-bg
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    canary:
      canaryService: webapp-bg-canary
      stableService: webapp-bg-stable
      trafficRouting:
        nginx: {}
      steps:
        - setWeight: 25
          pause:
            duration: 3m
        - setWeight: 50
          pause:
            duration: 12m
        - setWeight: 100
  template:
    metadata:
      labels:
        app: webapp
        version: green
    spec:
      containers:
        - name: webapp
          image: smitdarji/k8s:v.g.1.0   # ✅ Update this tag for each deployment
          ports:
            - containerPort: 80
              protocol: TCP
      imagePullSecrets:
        - name: ghcr-secret
