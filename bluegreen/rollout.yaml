apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webapp-bg
  namespace: webapp-bg
  labels:
    app: webapp
    releaseColor: blue # ⚙️ CI/CD pipeline flips this automatically between blue/green
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    blueGreen:
      activeService: webapp-bg-stable # 🌐 Stable (live) service
      previewService: webapp-bg-preview # 🧪 Preview (staging) service
      autoPromotionEnabled: true # ✅ Automatically promotes after tests
      autoPromotionSeconds: 180 # ⏳ Delay before promotion
  template:
    metadata:
      labels:
        app: webapp
        version: green # 🟢 Active version (flipped by CI)
    spec:
      containers:
        - name: webapp
          image: smitdarji/k8s:webapp_green_ace28ca # 🔄 Updated dynamically by CI/CD (format: webapp_<color>_<sha>)
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
