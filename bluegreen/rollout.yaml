apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webapp-bg
  namespace: webapp-bg
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: webapp-bg
  strategy:
    blueGreen:
      activeService: webapp-bg-stable        # ✅ Main live traffic service
      previewService: webapp-bg-canary       # ✅ Preview service for validation
      autoPromotionEnabled: false            # Disable instant promotion
      autoPromotionSeconds: 300              # ⏳ Wait 5 minutes before switching
      scaleDownDelaySeconds: 60              # Keep old pods for rollback
  template:
    metadata:
      labels:
        app: webapp-bg
    spec:
      containers:
      - name: webapp-bg
        image: smitdarji/k8s:v.g.1.5         # 👈 Replace with your image tag
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
