apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-stable
  namespace: webapp-bg
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-canary
  namespace: webapp-bg
spec:
  type: NodePort
  selector:
    app: webapp
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
