apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-stable
  namespace: webapp-bg
spec:
  selector:
    app: webapp-bg
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-canary
  namespace: webapp-bg
spec:
  selector:
    app: webapp-bg
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30081
  type: NodePort
