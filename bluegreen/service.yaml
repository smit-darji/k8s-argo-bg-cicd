apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-stable
  namespace: webapp-bg
spec:
  selector:
    app: webapp
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-preview
  namespace: webapp-bg
spec:
  selector:
    app: webapp
    version: green
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31081
  type: NodePort
