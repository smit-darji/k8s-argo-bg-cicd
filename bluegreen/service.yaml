apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-stable
  namespace: webapp-bg
spec:
  type: NodePort
  selector:
    app: webapp-bg
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-preview
  namespace: webapp-bg
spec:
  type: NodePort
  selector:
    app: webapp-bg-preview
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
