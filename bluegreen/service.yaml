apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-stable
  namespace: webapp-bg
spec:
  selector:
    app: webapp
    version: blue   # ✅ currently active (live traffic)
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30710
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-preview
  namespace: webapp-bg
spec:
  selector:
    app: webapp
    version: blue  # ✅ currently preview (next version)
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32145
  type: NodePort
