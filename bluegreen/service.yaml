apiVersion: v1
kind: Service
metadata:
  name: webapp-bg-stable
  namespace: webapp-bg
spec:
  selector:
    app: webapp
    version: blue # ✅ currently stable/live
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30710
  type: NodePort
items: []
