apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-app-green
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-app
      version: green
  template:
    metadata:
      labels:
        app: k8s-app
        version: green
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: k8s-app
        image: smitdarji/k8s:v.g.1.0  # 🔹 Green version (new candidate)
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"