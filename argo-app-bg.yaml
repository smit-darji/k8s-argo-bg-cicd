apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-app-bluegreen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/smit-darji/kubernetes-cicd.git'   
    targetRevision: Master                                        
    path: bluegreen
  destination:
    server: https://kubernetes.default.svc
    namespace: webapps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
