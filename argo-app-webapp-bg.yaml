apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-bg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/smit-darji/k8s-argo-bg-cicd.git'
    targetRevision: Master
    path: bluegreen
  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-bg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
---
# ✅ Fix: Give Argo Rollouts controller access to configmaps in argocd namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-rollouts-config-access
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-rollouts-config-access
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argocd
roleRef:
  kind: Role
  name: argo-rollouts-config-access
  apiGroup: rbac.authorization.k8s.io
