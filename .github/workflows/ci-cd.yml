name: 🌈 Blue-Green Auto Deployment (Full CI/CD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Detect current active color from service.yaml
      - name: Detect current active color
        id: detect
        run: |
          SERVICE_FILE="bluegreen/service.yaml"
          CURRENT_COLOR=$(grep 'version:' $SERVICE_FILE | head -1 | awk '{print $2}')
          echo "Current active color (from file): $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
            COLOR_TAG="v.gg"
          else
            NEW_COLOR="blue"
            COLOR_TAG="v.bb"
          fi

          echo "Switching to: $NEW_COLOR"
          echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
          echo "COLOR_TAG=$COLOR_TAG" >> $GITHUB_ENV

      # 3️⃣ Generate new Docker tag (auto-increment)
      - name: Generate new Docker tag
        id: tag
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          CURRENT_TAG=$(grep 'image:' $DEPLOY_FILE | awk -F ':' '{print $3}')
          PREFIX=$(echo $CURRENT_TAG | awk -F '.' '{print $1"."$2"."$3}')
          PATCH=$(echo $CURRENT_TAG | awk -F '.' '{print $4 + 1}')
          NEW_TAG="${PREFIX}.${PATCH}"
          echo "New image tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 4️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build and Push Image
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 6️⃣ Update all bluegreen manifests dynamically
      - name: Update all manifests dynamically
        run: |
          echo "🔧 Updating manifests for ${{ env.NEW_COLOR }} → smitdarji/k8s:${{ env.NEW_TAG }}"

          # Update the new deployment file
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" $DEPLOY_FILE

          # Update rollout.yaml version
          sed -i "s/version: .*/version: ${{ env.NEW_COLOR }}/g" bluegreen/rollout.yaml

          # Update service selector to new color
          sed -i "s/version: ${{ env.CURRENT_COLOR }}/version: ${{ env.NEW_COLOR }}/g" bluegreen/service.yaml

          # Update ingress color annotation (if used)
          sed -i "s/version: ${{ env.CURRENT_COLOR }}/version: ${{ env.NEW_COLOR }}/g" bluegreen/ingress.yaml || true

          echo "✅ All bluegreen files updated!"

      # 7️⃣ Commit and push changes (to trigger ArgoCD auto-sync)
      - name: Commit and push updates
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Auto Deploy → ${{ env.NEW_COLOR }} | Tag: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push

      # 8️⃣ Optional: Gradual rollout promotion (25 → 50 → 100%)
      - name: Gradual rollout promotion
        run: |
          echo "⏳ Gradually promoting rollout..."
          sleep 180
          kubectl argo rollouts promote webapp-bg -n webapp-bg || true
          sleep 180
          kubectl argo rollouts promote webapp-bg -n webapp-bg || true
          sleep 240
          echo "✅ Rollout promoted successfully!"
