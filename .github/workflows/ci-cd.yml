name: CI/CD BG Pipeline (Auto Versioning + ArgoCD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Get current tag from deployment.yaml
      - name: Get current version
        id: version
        run: |
          CURRENT=$(grep 'image:' deployment.yaml | awk -F ':' '{print $3}')
          echo "Current tag: $CURRENT"
          NUM=${CURRENT#v}
          # Split into parts and increment last number
          IFS='.' read -r major minor patch <<< "$NUM"
          NEW_PATCH=$((patch + 1))
          NEW_TAG="v${major}.${minor}.${NEW_PATCH}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "New version: $NEW_TAG"

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:latest
            smitdarji/k8s:${{ env.NEW_TAG }}

      # 5️⃣ Auto-update deployment.yaml with new version
      - name: Update deployment.yaml
        run: |
          echo "Updating deployment.yaml to use tag ${{ env.NEW_TAG }}..."
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" deployment.yaml
          cat deployment.yaml

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "Auto-update image to ${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push
