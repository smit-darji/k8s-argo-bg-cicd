name: CI/CD BG Pipeline (Auto Versioning + ArgoCD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Detect which color is currently active
      - name: Detect Active Color
        id: detect
        run: |
          CURRENT_COLOR=$(grep 'version:' bluegreen/service.yaml | awk '{print $2}')
          echo "🎯 Current active color: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
            COLOR_TAG="v.g"
          else
            NEW_COLOR="blue"
            COLOR_TAG="v.b"
          fi

          echo "🌀 Switching traffic to: $NEW_COLOR"
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
          echo "COLOR_TAG=$COLOR_TAG" >> $GITHUB_ENV

      # 3️⃣ Determine the current tag from inactive deployment
      - name: Get current version
        id: version
        run: |
          if [ "${{ env.NEW_COLOR }}" = "blue" ]; then
            DEPLOY_FILE="bluegreen/deployment-blue.yaml"
          else
            DEPLOY_FILE="bluegreen/deployment-green.yaml"
          fi

          CURRENT=$(grep 'image:' $DEPLOY_FILE | awk -F ':' '{print $3}')
          echo "Current tag: $CURRENT"

          # If no version found, start from 0
          if [[ -z "$CURRENT" ]]; then
            CURRENT="${{ env.COLOR_TAG }}.0.0"
          fi

          NUM=${CURRENT#v.*.}
          IFS='.' read -r prefix patch <<< "$NUM"
          NEW_PATCH=$((patch + 1))
          NEW_TAG="${{ env.COLOR_TAG }}.${NEW_PATCH}"

          echo "🚀 New version tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 4️⃣ Docker Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 6️⃣ Update the inactive deployment with new tag
      - name: Update inactive deployment
        run: |
          if [ "${{ env.NEW_COLOR }}" = "blue" ]; then
            DEPLOY_FILE="bluegreen/deployment-blue.yaml"
          else
            DEPLOY_FILE="bluegreen/deployment-green.yaml"
          fi

          echo "🔧 Updating $DEPLOY_FILE with tag smitdarji/k8s:${{ env.NEW_TAG }}"
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" $DEPLOY_FILE
          cat $DEPLOY_FILE

      # 7️⃣ Switch service selector to the new color
      - name: Update service selector
        run: |
          echo "🌈 Switching service traffic to ${{ env.NEW_COLOR }}..."
          sed -i "s/version: .*/version: ${{ env.NEW_COLOR }}/g" bluegreen/service.yaml
          cat bluegreen/service.yaml

      # 8️⃣ Commit and Push all updated files
      - name: Commit & Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Blue-Green Deploy: Switched to ${{ env.NEW_COLOR }} | Tag: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push

      # 9️⃣ Trigger Local ArgoCD Sync (Manual mode)
      - name: Trigger ArgoCD Sync (Local)
        if: always()
        run: |
          echo "🔄 Triggering local ArgoCD sync..."
          argocd login localhost:8080 \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}" \
            --insecure --grpc-web
          argocd app sync webapp-bg --grpc-web
          argocd app wait webapp-bg --health --sync --grpc-web
          echo "✅ ArgoCD Sync Completed!"
