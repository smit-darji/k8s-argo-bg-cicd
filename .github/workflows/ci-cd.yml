name: 🌈 Blue-Green Auto Deployment (Full CI/CD)

on:
  push:
    branches:
      - main
      - Master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install yq for safe YAML edits
      - name: Install yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # 3️⃣ Detect current active color from rollout.yaml
      - name: Detect current active color
        id: detect
        run: |
          ROLLOUT_FILE="bluegreen/rollout.yaml"
          CURRENT_COLOR=$(yq '.spec.template.metadata.labels.version' $ROLLOUT_FILE)
          echo "🟢 Current color is: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
          else
            NEW_COLOR="blue"
          fi

          echo "Switching to color: $NEW_COLOR"
          echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV

      # 4️⃣ Generate tag in required format (webapp_<color>_<short-sha>)
      - name: Generate Docker image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NEW_TAG="webapp_${{ env.NEW_COLOR }}_${SHORT_SHA}"
          echo "🧩 New image tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 5️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6️⃣ Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 7️⃣ Update deployment manifest
      - name: Update deployment image
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          yq -i ".spec.template.spec.containers[0].image = \"smitdarji/k8s:${{ env.NEW_TAG }}\"" "$DEPLOY_FILE"
          echo "✅ Updated $DEPLOY_FILE → smitdarji/k8s:${{ env.NEW_TAG }}"

      # 8️⃣ Update rollout.yaml (switch version + image)
      - name: Update rollout.yaml
        run: |
          yq -i ".spec.template.metadata.labels.version = \"${{ env.NEW_COLOR }}\"" bluegreen/rollout.yaml
          yq -i ".spec.template.spec.containers[0].image = \"smitdarji/k8s:${{ env.NEW_TAG }}\"" bluegreen/rollout.yaml
          echo "✅ rollout.yaml updated → version=${{ env.NEW_COLOR }}, image=${{ env.NEW_TAG }}"

      # 9️⃣ Update preview service selector
      - name: Update service selector
        run: |
          SERVICE_FILE="bluegreen/service.yaml"
          yq -i "(.spec.selector.version) = \"${{ env.NEW_COLOR }}\"" "$SERVICE_FILE"
          echo "✅ Preview service selector set to ${{ env.NEW_COLOR }}"

      # 🔟 Commit & push (ArgoCD auto-sync)
      - name: Commit and push manifest changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Auto Deploy → ${{ env.NEW_COLOR }} | smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push

      # # 1️⃣1️⃣ Optional: ArgoCD sync trigger (if watching this repo)
      # - name: Trigger ArgoCD Sync (optional)
      #   if: ${{ success() }}
      #   run: echo "🔁 ArgoCD auto-sync will pick up the manifest changes automatically."
