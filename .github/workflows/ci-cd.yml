name: CI/CD BG Pipeline (Auto Versioning + ArgoCD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Determine current Blue/Green active environment
      - name: Detect Active Color
        id: detect
        run: |
          CURRENT_COLOR=$(grep 'version:' bluegreen/service.yaml | awk '{print $2}')
          echo "Current active color: $CURRENT_COLOR"
          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
          else
            NEW_COLOR="blue"
          fi
          echo "Switching traffic to: $NEW_COLOR"
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV

      # 3️⃣ Get current version tag from the inactive deployment
      - name: Get current version
        id: version
        run: |
          if [ "${{ env.NEW_COLOR }}" = "blue" ]; then
            DEPLOY_FILE="bluegreen/deployment-blue.yaml"
          else
            DEPLOY_FILE="bluegreen/deployment-green.yaml"
          fi
          CURRENT=$(grep 'image:' $DEPLOY_FILE | awk -F ':' '{print $3}')
          echo "Current tag: $CURRENT"
          NUM=${CURRENT#v}
          IFS='.' read -r major minor patch <<< "$NUM"
          NEW_PATCH=$((patch + 1))
          NEW_TAG="v${major}.${minor}.${NEW_PATCH}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "New version: $NEW_TAG"

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 6️⃣ Update inactive deployment file
      - name: Update inactive deployment
        run: |
          if [ "${{ env.NEW_COLOR }}" = "blue" ]; then
            DEPLOY_FILE="bluegreen/deployment-blue.yaml"
          else
            DEPLOY_FILE="bluegreen/deployment-green.yaml"
          fi

          echo "Updating $DEPLOY_FILE with tag ${{ env.NEW_TAG }}..."
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" $DEPLOY_FILE
          cat $DEPLOY_FILE

      # 7️⃣ Switch service to new color
      - name: Update service selector
        run: |
          echo "Switching service to ${{ env.NEW_COLOR }}..."
          sed -i "s/version: .*/version: ${{ env.NEW_COLOR }}/g" bluegreen/service.yaml
          cat bluegreen/service.yaml

      # 8️⃣ Commit and push all changes
      - name: Commit & Push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Auto deploy to ${{ env.NEW_COLOR }} | Image: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes"
          git push

      # 9️⃣ Trigger ArgoCD Sync (optional)
      - name: Trigger ArgoCD Sync (Local)
        if: always()
        run: |
          echo "Triggering local ArgoCD sync..."
          argocd login localhost:8080 --username admin --password ${{ secrets.ARGOCD_PASSWORD }} --insecure --grpc-web
          argocd app sync webapp-bg --grpc-web