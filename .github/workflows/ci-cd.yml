name: CI/CD Blue-Green Pipeline (Auto Version + AutoSync ArgoCD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Detect current color (from service.yaml)
      - name: Detect active color
        id: color
        run: |
          CURRENT_COLOR=$(grep 'version:' bluegreen/service.yaml | awk '{print $2}')
          echo "Current active color: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
            COLOR_TAG="v.g"
          else
            NEW_COLOR="blue"
            COLOR_TAG="v.b"
          fi

          echo "Switching to: $NEW_COLOR"
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
          echo "COLOR_TAG=$COLOR_TAG" >> $GITHUB_ENV

      # 3️⃣ Generate next version tag like v.b.1.1 or v.g.1.1
      - name: Generate new version tag
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"

          # Extract the current version from image line (v.b.1.0 or v.g.1.0)
          CURRENT_TAG=$(grep 'image:' $DEPLOY_FILE | awk -F ':' '{print $3}')
          CURRENT_TAG=${CURRENT_TAG:-"${{ env.COLOR_TAG }}.1.0"}
          echo "Current image tag: $CURRENT_TAG"

          # Split and increment patch number (fourth field)
          PREFIX=$(echo $CURRENT_TAG | awk -F '.' '{print $1"."$2"."$3}')
          PATCH=$(echo $CURRENT_TAG | awk -F '.' '{print $4 + 1}')
          NEW_TAG="${PREFIX}.${PATCH}"

          echo "🚀 New image tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 4️⃣ Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 6️⃣ Update inactive deployment image
      - name: Update inactive deployment
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          echo "Updating $DEPLOY_FILE with new tag: smitdarji/k8s:${{ env.NEW_TAG }}"
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" $DEPLOY_FILE
          cat $DEPLOY_FILE

      # 7️⃣ Switch service traffic to the new color
      - name: Switch traffic color
        run: |
          echo "Switching service to ${{ env.NEW_COLOR }}"
          sed -i "s/version: .*/version: ${{ env.NEW_COLOR }}/g" bluegreen/service.yaml
          cat bluegreen/service.yaml

      # 8️⃣ Commit & push (ArgoCD will auto-sync)
      - name: Commit and push updates
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Blue-Green Deploy → ${{ env.NEW_COLOR }} | Tag: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push
