name: 🌈 Blue-Green Auto Deployment (Full CI/CD)

on:
  push:
    branches:
      - main
      - Master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Install yq for safe YAML edits
      - name: Install yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # 3️⃣ Detect current active color from rollout.yaml
      - name: Detect current active color
        id: detect
        run: |
          ROLL_OUT_FILE="bluegreen/rollout.yaml"

          CURRENT_COLOR=$(yq '.spec.template.metadata.labels.version' $ROLL_OUT_FILE)
          echo "🟢 Current active color: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
            COLOR_TAG="gg_l"
          else
            NEW_COLOR="blue"
            COLOR_TAG="bb_l"
          fi

          echo "Switching deployment to: $NEW_COLOR"
          echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
          echo "COLOR_TAG=$COLOR_TAG" >> $GITHUB_ENV

      # 4️⃣ Generate new Docker tag with build number or commit ID
      - name: Generate new Docker tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NEW_TAG="${{ env.COLOR_TAG }}.${{ github.run_number }}_${SHORT_SHA}"
          echo "🧩 New Docker tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 5️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6️⃣ Build and Push Docker Image
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 7️⃣ Update Deployment Manifest with new image
      - name: Update deployment image
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          yq -i ".spec.template.spec.containers[0].image = \"smitdarji/k8s:${{ env.NEW_TAG }}\"" "$DEPLOY_FILE"
          echo "✅ Deployment image updated → $DEPLOY_FILE"

      # 8️⃣ Update rollout.yaml template version + image
      - name: Update rollout version and image
        run: |
          yq -i ".spec.template.metadata.labels.version = \"${{ env.NEW_COLOR }}\"" bluegreen/rollout.yaml
          yq -i ".spec.template.spec.containers[0].image = \"smitdarji/k8s:${{ env.NEW_TAG }}\"" bluegreen/rollout.yaml
          echo "✅ Rollout updated → version=${{ env.NEW_COLOR }} | image=${{ env.NEW_TAG }}"

      # 9️⃣ Update service selectors
      - name: Update service selectors
        run: |
          SERVICE_FILE="bluegreen/service.yaml"
          yq -i "(.items[] | select(.metadata.name == \"webapp-bg-preview\").spec.selector.version) = \"${{ env.NEW_COLOR }}\"" "$SERVICE_FILE" || \
          yq -i ".spec.selector.version = \"${{ env.NEW_COLOR }}\"" "$SERVICE_FILE"
          echo "✅ Preview service selector → ${{ env.NEW_COLOR }}"

      # 🔟 Commit and push changes to repo
      - name: Commit and push updates
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Auto Deploy → ${{ env.NEW_COLOR }} | Tag: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push

      # # 1️⃣1️⃣ (Optional) Trigger ArgoCD Refresh
      # - name: Trigger ArgoCD Auto Sync
      #   if: ${{ success() }}
      #   run: |
      #     echo "🔁 Triggering ArgoCD auto-sync (if enabled in repo)..."
