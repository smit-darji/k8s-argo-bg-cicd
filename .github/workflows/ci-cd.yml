name: 🌈 Blue-Green Auto Deployment (Full CI/CD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Detect current active color (from rollout.yaml)
      - name: Detect current active color
        id: detect
        run: |
          ROLLOUT_FILE="bluegreen/rollout.yaml"
          CURRENT_COLOR=$(grep 'version:' $ROLLOUT_FILE | head -1 | awk '{print $2}')
          echo "Current active color: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
            COLOR_TAG="v.gg"
          else
            NEW_COLOR="blue"
            COLOR_TAG="v.bb"
          fi

          echo "Switching to: $NEW_COLOR"
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
          echo "COLOR_TAG=$COLOR_TAG" >> $GITHUB_ENV

      # 3️⃣ Generate new Docker image tag (auto increment)
      - name: Generate new Docker tag
        id: tag
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          CURRENT_TAG=$(grep 'image:' $DEPLOY_FILE | awk -F ':' '{print $3}')
          PREFIX=$(echo $CURRENT_TAG | awk -F '.' '{print $1"."$2"."$3}')
          PATCH=$(echo $CURRENT_TAG | awk -F '.' '{print $4 + 1}')
          NEW_TAG="${PREFIX}.${PATCH}"
          echo "New image tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 4️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build and push image
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 6️⃣ Update rollout and service dynamically
      - name: Update manifests
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          ROLLOUT_FILE="bluegreen/rollout.yaml"
          SERVICE_FILE="bluegreen/service.yaml"

          echo "Updating deployment → smitdarji/k8s:${{ env.NEW_TAG }}"
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" $DEPLOY_FILE

          echo "Updating rollout version → ${{ env.NEW_COLOR }}"
          sed -i "s/version: .*/version: ${{ env.NEW_COLOR }}/g" $ROLLOUT_FILE

          echo "Updating service selector versions"
          sed -i "s/version: blue/version: ${{ env.NEW_COLOR }}/g" $SERVICE_FILE
          sed -i "s/version: green/version: ${{ env.NEW_COLOR }}/g" $SERVICE_FILE

      # 7️⃣ Commit and push to trigger ArgoCD auto-sync
      - name: Commit and push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Auto Deploy → ${{ env.NEW_COLOR }} | Tag: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes"
          git push

      # 8️⃣ Gradual rollout promotion (optional)
      - name: Monitor rollout (25%, 50%, 100%)
        run: |
          echo "⏳ Waiting for rollout to promote gradually..."
          sleep 180   # 3 mins - 25%
          kubectl argo rollouts promote webapp-bg -n webapp-bg || true
          sleep 180   # 3 mins - 50%
          kubectl argo rollouts promote webapp-bg -n webapp-bg || true
          sleep 240   # 4 mins - 100%
          echo "✅ Rollout completed successfully!"
