name: 🌈 Blue-Green Auto Deployment (Full CI/CD)

on:
  push:
    branches:
      - main
      - Master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Detect current active color from rollout.yaml
      - name: Detect current active color
        id: detect
        run: |
          ROLL_OUT_FILE="bluegreen/rollout.yaml"
          CURRENT_COLOR=$(grep 'version:' $ROLL_OUT_FILE | grep 'app: webapp' -A1 | tail -1 | awk '{print $2}' | tr -d '[:space:]')
          echo "Current active color: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
            COLOR_TAG="gg_l"
          else
            NEW_COLOR="blue"
            COLOR_TAG="bb_l"
          fi

          echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV
          echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
          echo "COLOR_TAG=$COLOR_TAG" >> $GITHUB_ENV
          echo "Switching to: $NEW_COLOR"

      # 3️⃣ Generate new Docker tag (auto-increment)
      - name: Generate new Docker tag
        id: tag
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          # Cleanly extract current tag
          CURRENT_TAG=$(grep 'image:' "$DEPLOY_FILE" | awk '{print $2}' | awk -F '/' '{print $NF}' | awk -F ':' '{print $2}' | tr -d '[:space:]')
          echo "Current tag: $CURRENT_TAG"

          # Split tag into parts and increment patch
          IFS='.' read -r PREFIX1 PREFIX2 PREFIX3 PATCH <<< "$CURRENT_TAG"
          PATCH=$((PATCH + 1))
          NEW_TAG="${PREFIX1}.${PREFIX2}.${PREFIX3}.${PATCH}"
          NEW_TAG=$(echo $NEW_TAG | tr -d '[:space:]')
          echo "New Docker tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 4️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build and Push Docker Image
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:${{ env.NEW_TAG }}
            smitdarji/k8s:latest

      # 6️⃣ Update Deployment Manifest with new image
      - name: Update deployment image
        run: |
          DEPLOY_FILE="bluegreen/deployment-${{ env.NEW_COLOR }}.yaml"
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.NEW_TAG }}|g" "$DEPLOY_FILE"
          echo "✅ Deployment image updated: $DEPLOY_FILE"

      # 7️⃣ Update rollout.yaml template version
      - name: Update rollout version
        run: |
          sed -i "/template:/,/spec:/ s/version: .*/version: ${{ env.NEW_COLOR }}/" bluegreen/rollout.yaml
          echo "✅ Rollout template version updated to ${{ env.NEW_COLOR }}"

      # 8️⃣ Update preview service selector only
      - name: Update preview service selector
        run: |
          PREVIEW_FILE="bluegreen/webapp-bg-preview.yaml"
          sed -i "s/version: .*/version: ${{ env.NEW_COLOR }}/" "$PREVIEW_FILE"
          echo "✅ Preview service selector updated to ${{ env.NEW_COLOR }}"

      # 9️⃣ Commit and push changes (trigger ArgoCD auto-sync)
      - name: Commit and push updates
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add bluegreen/
          git commit -m "🚀 Auto Deploy → ${{ env.NEW_COLOR }} | Tag: smitdarji/k8s:${{ env.NEW_TAG }}" || echo "No changes to commit"
          git push
